name: Construire l'APK Boite PDF

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les fichiers du dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Créer le projet Android
        run: |
          set -e
          HTML=""
          if [ -f compresseur-pdf.html ]; then HTML=compresseur-pdf.html; else HTML=$(ls *.html 2>/dev/null | head -n 1 || true); fi
          if [ -z "$HTML" ]; then echo "::error::Aucun fichier .html trouvé à la racine du dépôt. Ajoutez compresseur-pdf.html."; exit 1; fi
          ICON=""
          if [ -f icone-512.png ]; then ICON=icone-512.png; else ICON=$(ls icone*.png 2>/dev/null | head -n 1 || true); fi
          if [ -z "$ICON" ]; then echo "::error::Aucune icône trouvée. Ajoutez icone-512.png à la racine du dépôt."; exit 1; fi
          echo "HTML utilisé : $HTML — icône : $ICON"

          P=android
          SRC=$P/app/src/main
          mkdir -p $SRC/assets $SRC/java/mg/boiteoutils/pdf $SRC/res/drawable-nodpi $SRC/res/mipmap-anydpi-v26 $SRC/res/mipmap-xxxhdpi $SRC/res/values $SRC/res/xml
          cp "$HTML" $SRC/assets/index.html
          cp "$ICON" $SRC/res/drawable-nodpi/ic_fg.png
          cp "$ICON" $SRC/res/mipmap-xxxhdpi/ic_launcher.png
          echo "" | base64 -d > $P/app/boite.jks

          cat > $P/settings.gradle <<'EOT'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "BoitePDF"
          include ':app'
          EOT

          cat > $P/build.gradle <<'EOT'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOT

          cat > $P/gradle.properties <<'EOT'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          EOT

          cat > $P/app/build.gradle <<'EOT'
          plugins { id 'com.android.application' }
          android {
            namespace 'mg.boiteoutils.pdf'
            compileSdk 34
            defaultConfig {
              applicationId 'mg.boiteoutils.pdf'
              minSdk 24
              targetSdk 34
              versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
              versionName '1.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
            }
            signingConfigs {
              fixe { storeFile file('boite.jks'); storePassword 'boitepdf2026'; keyAlias 'boite'; keyPassword 'boitepdf2026' }
            }
            buildTypes {
              release { minifyEnabled false; signingConfig signingConfigs.fixe }
            }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            androidResources { noCompress 'html' }
          }
          dependencies {
            implementation 'androidx.webkit:webkit:1.11.0'
            implementation 'androidx.core:core:1.13.1'
          }
          EOT

          cat > $SRC/AndroidManifest.xml <<'EOT'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>
            <application android:label="@string/app_name" android:icon="@mipmap/ic_launcher"
                android:theme="@android:style/Theme.Material.Light.NoActionBar"
                android:hardwareAccelerated="true" android:largeHeap="true">
              <activity android:name=".MainActivity" android:exported="true"
                  android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|uiMode"
                  android:windowSoftInputMode="adjustResize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
              <provider android:name="androidx.core.content.FileProvider"
                  android:authorities="mg.boiteoutils.pdf.fichiers"
                  android:exported="false" android:grantUriPermissions="true">
                <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/chemins"/>
              </provider>
            </application>
          </manifest>
          EOT

          cat > $SRC/res/values/strings.xml <<'EOT'
          <resources><string name="app_name">Boîte PDF</string></resources>
          EOT

          cat > $SRC/res/xml/chemins.xml <<'EOT'
          <paths><cache-path name="partage" path="partage/"/></paths>
          EOT

          cat > $SRC/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOT'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/fond_icone"/>
            <foreground><inset android:drawable="@drawable/ic_fg" android:inset="17%"/></foreground>
          </adaptive-icon>
          EOT

          cat > $SRC/res/values/colors.xml <<'EOT'
          <resources><color name="fond_icone">#F1F9F6</color></resources>
          EOT

          cat > $SRC/java/mg/boiteoutils/pdf/MainActivity.java <<'EOT'
          package mg.boiteoutils.pdf;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import androidx.core.content.FileProvider;
          import androidx.webkit.WebViewAssetLoader;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.Map;
          import java.util.UUID;

          public class MainActivity extends Activity {
            static final int REQ_FICHIER = 11, REQ_ENREG = 12, REQ_PERM = 13;
            static final String ACCUEIL = "https://appassets.androidplatform.net/assets/index.html";
            WebView web;
            ValueCallback<Uri[]> rappelFichier;
            final Map<String, File> fichiers = new HashMap<>();
            final Map<String, String> types = new HashMap<>();
            String enAttente;

            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().setStatusBarColor(0xFF0F5C4D);
              effacer(new File(getCacheDir(), "partage"));
              web = new WebView(this);
              setContentView(web);
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setAllowFileAccess(false);
              s.setAllowContentAccess(true);
              s.setTextZoom(100);
              final WebViewAssetLoader chargeur = new WebViewAssetLoader.Builder()
                  .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this)).build();
              web.setWebViewClient(new WebViewClient() {
                @Override public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                  return chargeur.shouldInterceptRequest(r.getUrl());
                }
                @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                  Uri u = r.getUrl();
                  if ("appassets.androidplatform.net".equals(u.getHost())) return false;
                  try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception e) { }
                  return true;
                }
              });
              web.setWebChromeClient(new WebChromeClient() {
                @Override public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                  if (rappelFichier != null) rappelFichier.onReceiveValue(null);
                  rappelFichier = cb;
                  Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType(typeAccepte(p.getAcceptTypes()));
                  if (p.getMode() == FileChooserParams.MODE_OPEN_MULTIPLE) i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                  try { startActivityForResult(Intent.createChooser(i, "Choisir un fichier"), REQ_FICHIER); }
                  catch (Exception e) { rappelFichier = null; return false; }
                  return true;
                }
              });
              web.addJavascriptInterface(new Pont(), "AndroidBridge");
              if (b == null || web.restoreState(b) == null) web.loadUrl(ACCUEIL);
            }

            @Override protected void onSaveInstanceState(Bundle o) { super.onSaveInstanceState(o); web.saveState(o); }

            static String typeAccepte(String[] acc) {
              boolean image = false, pdf = false, autre = false;
              if (acc != null) for (String a0 : acc) for (String a : a0.split(",")) {
                a = a.trim().toLowerCase();
                if (a.isEmpty()) continue;
                if (a.startsWith("image/")) image = true;
                else if (a.equals("application/pdf") || a.equals(".pdf")) pdf = true;
                else autre = true;
              }
              if (image && !pdf && !autre) return "image/*";
              if (pdf && !image && !autre) return "application/pdf";
              return "*/*";
            }

            @Override public void onBackPressed() {
              if (web.canGoBack()) web.goBack(); else super.onBackPressed();
            }

            @Override protected void onActivityResult(int req, int res, Intent data) {
              super.onActivityResult(req, res, data);
              if (req == REQ_FICHIER) {
                Uri[] r = null;
                if (res == RESULT_OK && data != null) {
                  ClipData c = data.getClipData();
                  if (c != null) { r = new Uri[c.getItemCount()]; for (int k = 0; k < r.length; k++) r[k] = c.getItemAt(k).getUri(); }
                  else if (data.getData() != null) r = new Uri[]{ data.getData() };
                }
                if (rappelFichier != null) rappelFichier.onReceiveValue(r);
                rappelFichier = null;
              } else if (req == REQ_ENREG) {
                if (res == RESULT_OK && data != null && data.getData() != null && enAttente != null) {
                  try (OutputStream o = getContentResolver().openOutputStream(data.getData())) {
                    copier(fichiers.get(enAttente), o);
                    message("Fichier enregistré ✔");
                  } catch (Exception e) { message("Échec de l'enregistrement : " + e.getMessage()); }
                }
                enAttente = null;
              }
            }

            @Override public void onRequestPermissionsResult(int req, String[] p, int[] g) {
              if (req == REQ_PERM && enAttente != null) {
                String id = enAttente; enAttente = null;
                if (g.length > 0 && g[0] == PackageManager.PERMISSION_GRANTED) message(enregistrer(id));
                else message("Autorisation refusée : fichier non enregistré.");
              }
            }

            void message(final String m) { runOnUiThread(() -> Toast.makeText(this, m, Toast.LENGTH_LONG).show()); }

            static void copier(File f, OutputStream o) throws Exception {
              try (InputStream in = new FileInputStream(f)) {
                byte[] buf = new byte[65536]; int n;
                while ((n = in.read(buf)) > 0) o.write(buf, 0, n);
              }
            }

            static void effacer(File f) {
              if (f.isDirectory()) { File[] l = f.listFiles(); if (l != null) for (File x : l) effacer(x); }
              f.delete();
            }

            String enregistrer(String id) {
              File f = fichiers.get(id);
              if (f == null) return "Fichier introuvable.";
              String type = types.get(id);
              try {
                if (Build.VERSION.SDK_INT >= 29) {
                  ContentValues cv = new ContentValues();
                  cv.put(MediaStore.MediaColumns.DISPLAY_NAME, f.getName());
                  cv.put(MediaStore.MediaColumns.MIME_TYPE, type);
                  cv.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/Boite PDF");
                  Uri u = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv);
                  if (u == null) return "Impossible de créer le fichier.";
                  try (OutputStream o = getContentResolver().openOutputStream(u)) { copier(f, o); }
                } else {
                  File dir = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "Boite PDF");
                  dir.mkdirs();
                  String nom = f.getName(), base = nom, ext = "";
                  int pt = nom.lastIndexOf('.');
                  if (pt > 0) { base = nom.substring(0, pt); ext = nom.substring(pt); }
                  File dest = new File(dir, nom);
                  for (int k = 1; dest.exists(); k++) dest = new File(dir, base + " (" + k + ")" + ext);
                  try (OutputStream o = new FileOutputStream(dest)) { copier(f, o); }
                }
                return "Enregistré dans Téléchargements › Boite PDF ✔";
              } catch (Exception e) { return "Échec : " + e.getMessage(); }
            }

            Uri uriDe(String id) {
              return FileProvider.getUriForFile(this, "mg.boiteoutils.pdf.fichiers", fichiers.get(id));
            }

            class Pont {
              @JavascriptInterface public String begin(String nom, String type) {
                String id = UUID.randomUUID().toString();
                String sur = nom == null ? "fichier" : nom.replaceAll("[\\\\/:*?\"<>|]", "_");
                if (sur.trim().isEmpty()) sur = "fichier";
                File dir = new File(getCacheDir(), "partage/" + id);
                dir.mkdirs();
                File f = new File(dir, sur);
                f.delete();
                fichiers.put(id, f);
                types.put(id, (type == null || type.isEmpty()) ? "application/octet-stream" : type);
                return id;
              }
              @JavascriptInterface public boolean chunk(String id, String b64) {
                File f = fichiers.get(id);
                if (f == null) return false;
                try (FileOutputStream o = new FileOutputStream(f, true)) {
                  o.write(Base64.decode(b64, Base64.DEFAULT)); return true;
                } catch (Exception e) { return false; }
              }
              @JavascriptInterface public void save(final String id) {
                runOnUiThread(() -> {
                  if (Build.VERSION.SDK_INT < 29 && checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                    enAttente = id;
                    requestPermissions(new String[]{ Manifest.permission.WRITE_EXTERNAL_STORAGE }, REQ_PERM);
                  } else message(enregistrer(id));
                });
              }
              @JavascriptInterface public void saveAs(final String id) {
                runOnUiThread(() -> {
                  File f = fichiers.get(id);
                  if (f == null) return;
                  enAttente = id;
                  Intent i = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType(types.get(id));
                  i.putExtra(Intent.EXTRA_TITLE, f.getName());
                  try { startActivityForResult(i, REQ_ENREG); } catch (Exception e) { message("Impossible d'ouvrir le choix du dossier."); }
                });
              }
              @JavascriptInterface public void share(final String ids) {
                runOnUiThread(() -> {
                  try {
                    ArrayList<Uri> uris = new ArrayList<>();
                    String type = null;
                    for (String id : ids.split(",")) {
                      if (!fichiers.containsKey(id)) continue;
                      uris.add(uriDe(id));
                      String t = types.get(id);
                      type = (type == null || type.equals(t)) ? t : "*/*";
                    }
                    if (uris.isEmpty()) return;
                    Intent i;
                    if (uris.size() == 1) { i = new Intent(Intent.ACTION_SEND); i.putExtra(Intent.EXTRA_STREAM, uris.get(0)); }
                    else { i = new Intent(Intent.ACTION_SEND_MULTIPLE); i.putParcelableArrayListExtra(Intent.EXTRA_STREAM, uris); }
                    i.setType(type);
                    ClipData c = ClipData.newRawUri("", uris.get(0));
                    for (int k = 1; k < uris.size(); k++) c.addItem(new ClipData.Item(uris.get(k)));
                    i.setClipData(c);
                    i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                    startActivity(Intent.createChooser(i, "Partager via"));
                  } catch (Exception e) { message("Partage impossible : " + e.getMessage()); }
                });
              }
              @JavascriptInterface public void open(final String id) {
                runOnUiThread(() -> {
                  try {
                    Intent i = new Intent(Intent.ACTION_VIEW);
                    i.setDataAndType(uriDe(id), types.get(id));
                    i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                    startActivity(Intent.createChooser(i, "Ouvrir avec"));
                  } catch (Exception e) { message("Aucune application pour ouvrir ce fichier."); }
                });
              }
            }
          }
          EOT

      - name: Construire l'APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renommer l'APK
        run: |
          mkdir -p sortie
          cp android/app/build/outputs/apk/release/*.apk "sortie/Boite-PDF-v1.${{ github.run_number }}.apk"
          ls -la sortie

      - name: Garder l'APK (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Boite-PDF-apk
          path: sortie/*.apk

      - name: Publier l'APK (onglet Releases, téléchargement direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Boîte PDF v1.${{ github.run_number }}
          files: sortie/*.apk
